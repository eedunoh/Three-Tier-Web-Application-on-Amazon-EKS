name: EKS platform ci/cd pipeline


# To update the Kubernetes manifests, my workflow uses envsubst to replace ${VAR} placeholders in template files with real values (like Cognito secrets, image names, tags). 
# This produces the final rendered YAML files: app_manifest.yml, ingress.yml, and kube_prometheus_values.yml. The workflow then commits and pushes these rendered files to the manifests/ and monitoring/ folders that Argo CD watches. 
# The push fails because the default GITHUB_TOKEN is read-only for repository contents. Adding permissions: contents: write grants the bot the write access needed to push the rendered manifests.
permissions:
  contents: write



# stage 1: Trigger
# Every push to main triggers the workflow. We can also use pull_request or schedule: - cron
on:
#   push:
#     branches:
#       - main

  # Defined to allow manual runs with inputs (needed for terraform destroy)
  # workflow_dispatch: Lets you run the workflow by hand from the GitHub website.
  # inputs: Creates options you must choose before the manual run starts.
  # required: true: Forces you to make a choice before you can click run.
  # default: false: Sets the starting choice to "no" so you do not delete things by

  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy infrastructure?"
        required: true
        default: "false"



# Stage 2: Define the jobs
jobs:
  deploy:
    runs-on: ubuntu-latest


    # Stage 3: define environment variables
    env: 
      TERRAFORM_DIR: terraform
      TF_PLAN_FILE: tfplan.binary

      AWS_REGION: "eu-north-1"
      APP_IMAGE: ${{ vars.IMAGE }}:${{ github.sha }}
      GRAFANA_PASSWORD: ${{ vars.GRAFANA_PASSWORD }}

    steps:

      # Stage 4: Check out your code
      # When GitHub Actions runs your workflow, it launches a fresh virtual machine (runner). That VM is empty and does not automatically contain your repository code.
      # So similar to Jenkins, if you want to: Run Terraform (terraform init, terraform plan, etc.) or Build Docker images (needs your Dockerfile), you need the repo files available inside the runner. 
      # That’s what this step does:
      - name: Checkout repository
        uses: actions/checkout@v3
  


      # Stage 5: Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      


      # Stage 6: Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2



      # Stage 7: Build Docker Images
      # This condition is necessary because right now, Docker build, push and terraform plan/apply are in the same job with terraform destroy. 
      # That means on manual runs with destroy=true, it will still run the pre-destroy steps like docker-push and terraform-apply before running terraform destroy, and that is not ideal.
      # So IT stops Github from building and pushing the docker image when we are destroying infrastructures. Basically, manual trigger with destroy=true → Skips the Docker Build stage
      - name: Build Docker Image
        if: github.event.inputs.destroy != 'true'
        run: |
          docker build -t $APP_IMAGE -f ./web_app/dockerfile .
   

      # Stage 8: Initialize Terraform
      # This is a reusable package (like plugins or modules) that someone has written and published on the GitHub Marketplace. 
      # hashicorp/setup-terraform@v2 → An action by HashiCorp that installs Terraform in the GitHub Actions runner. Without it, the runner has no Terraform installed.
      # It tells setup-terraform which Terraform version to install on the runner.
      - name: Initialize Terraform
        uses: hashicorp/setup-terraform@v3    
        with:
          terraform_version: 1.13.1



      # Stage 9: Run Terraform Init
      # I defined tf_vars to hold terraform secrets in the "env:" section at the top of this script. So on every terraform init, plan, apply or destroy, The secret values will be used.
      # Notice in this step, there is no "if" condition, That's because terraform needs to be initialized before we run terraform apply or destroy. 
      # Without this, terraform won't initilize the remote backend where the terraform files are stored.
      - name: Run Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
            terraform init



      # Stage 10: Run Terraform Plan 
      # I defined tf_vars to hold terraform secrets in the "env:" section at the top of this script. So on every terraform init, plan, apply or destroy, The secret values will be used.
      # Manual trigger with destroy=true → Skips Terraform Plan step
      - name: Run Terraform Plan
        if: github.event.inputs.destroy != 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
            terraform plan -out=$TF_PLAN_FILE



      # Stage 11: Terraform Apply 
      # Manual trigger with destroy=true → Skips Terraform Apply step
      # I defined tf_vars to hold terraform secrets in the "env:" section at the top of this script. So on every terraform init, plan, apply or destroy, The secret values will be used.
      - name: Terraform Apply
        if: github.event.inputs.destroy != 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform apply -auto-approve $TF_PLAN_FILE



      # Stage 12: Push Docker Images
      # Manual trigger with destroy=true → Skips the Docker Push stage
      - name: Push Docker Image to ECR
        if: github.event.inputs.destroy != 'true'
        run: |
          docker push $APP_IMAGE



      # Stage 13: Terraform looks in its state file and retrieves the value of these outputs defined in terraform files (user_pool_id, user_pool_client_id, user_pool_domain, acm_certificate_arn etc.)
      # Formats them individually as a GitHub Actions step output. "$GITHUB_OUTPUT" Saves it on Github so it can be used.

      # One challenge I encountered while working on the kubernetes manifests was how I would pass values to dynamic variables like cognito secrets, image name and tag etc to ArgoCD without disrupting its process.
      # I thought-of and tried out multiple approaches (see end of this CI/CD file for more notes on this) but the Native Templating (envsubst) won.

      # How it works: 
        # Create configuration files with ${VAR} placeholders and name them *.template.yml. Keep these templates in a separate folder (not watched by Argo CD).
        # During CI/CD, envsubst replaces the placeholders with real values and writes the final .yml files.
        # The final files are committed to Git in the folders Argo CD watches (manifests/, monitoring/).
        # Argo CD deploys only those final rendered manifests.

      # Why it won: It is bulletproof against character crashes (like colons in AWS ARNs), keeps templates cleanly reusable, ensures full Git visibility, and completely avoids infinite CI/CD pipeline loops.

      # Manual trigger with destroy=true → Skips Get_terraform_outputs and airflow_init_task steps.

      - name: Get Terraform outputs
        if: github.event.inputs.destroy != 'true'
        id: tf_outputs
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          echo "EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "USER_POOL_ID=$(terraform output -raw user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "USER_POOL_ARN=$(terraform output -raw user_pool_arn)" >> "$GITHUB_OUTPUT"
          echo "USER_POOL_CLIENT_ID=$(terraform output -raw user_pool_client_id)" >> "$GITHUB_OUTPUT"
          echo "USER_POOL_DOMAIN=$(terraform output -raw user_pool_domain)" >> "$GITHUB_OUTPUT"
          echo "ACM_CERTIFICATE_ARN=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
          echo "USER_POOL_CLIENT_SECRET=$(terraform output -raw user_pool_client_secret)" >> "$GITHUB_OUTPUT"


      # Generate yaml files from its template using envsubst
      - name: Render templates with envsubst
        if: github.event.inputs.destroy != 'true'
        env:
          USER_POOL_ID: ${{ steps.tf_outputs.outputs.USER_POOL_ID }}
          USER_POOL_ARN: ${{ steps.tf_outputs.outputs.USER_POOL_ARN }}
          USER_POOL_CLIENT_ID: ${{ steps.tf_outputs.outputs.USER_POOL_CLIENT_ID }}
          USER_POOL_DOMAIN: ${{ steps.tf_outputs.outputs.USER_POOL_DOMAIN }}
          ACM_CERTIFICATE_ARN: ${{ steps.tf_outputs.outputs.ACM_CERTIFICATE_ARN }}
          USER_POOL_CLIENT_SECRET: ${{ steps.tf_outputs.outputs.USER_POOL_CLIENT_SECRET }}

          APP_IMAGE: ${{ env.APP_IMAGE }} 
          GRAFANA_PASSWORD: ${{ env.GRAFANA_PASSWORD }}

        # No need to cd into gitops; we are already at repo root
        run: |
          envsubst < yaml_templates/app_manifest.template.yml > manifests/app_manifest.yml
          envsubst < yaml_templates/ingress.template.yml > manifests/ingress.yml
          envsubst < yaml_templates/kube_prometheus_values.template.yml > monitoring/kube_prometheus_values.yml



      # Commit the rendered files so ArgoCD detects the change and syncs
      # These set the Git author and committer identity for the commands in this step.
      # Without them, Git may not know who is making the commit, causing the Author identity unknown error. Using the GitHub Actions bot identity is a standard practice for automated commits.

      # git diff --cached --quiet checks whether there are any staged changes compared to the last commit. It is a guard that prevents errors from an empty commit

      # This step safely commits and pushes the rendered manifest files only when they have actually changed, using the GitHub Actions bot identity and the env block ensures Git knows the author/committer identity.
      - name: Commit and push rendered files
        if: github.event.inputs.destroy != 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git add manifests/app_manifest.yml manifests/ingress.yml monitoring/kube_prometheus_values.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update rendered manifests [skip ci]"
            git push
          fi



      # Stage 14: Configure Kubernetes, Install ArgoCD and RUN manifests
      # This stage combines multiple executions. Argo CD will then pull the desired Kubernetes configuration from Git and deploy the application, Ingress, Prometheus and Grafana.
  
      # Configure kubectl so the GitHub Actions runner can communicate with EKS.
      - name: Configure kubectl/kubeconfig
        if: github.event.inputs.destroy != 'true'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.tf_outputs.outputs.EKS_CLUSTER_NAME }}"




      # Install Argo CD into the EKS cluster.

      # An ApplicationSet is an advanced feature used to automatically generate and manage multiple ArgoCD Applications at the same time (for example, if you wanted to deploy the same app across 50 different Kubernetes clusters simultaneously using a single template).
      # I disabled this because this project uses a single static EKS cluster with manually defined Applications and does not need dynamic generation.
      # Disabling this also saves valuable cluster CPU and memory resources by preventing unnecessary controller pods from running.

      # I encountred an error where Argo CD was already installed from a previous pipeline run, so re-running helm install in the CI/CD pipeline failed with “cannot re-use a name that is still in use” — even when the pipeline run was just updating the application, not needing to reinstall Argo CD.
      # The solution is to eplace helm install with helm upgrade --install to make the step idempotent: it installs Argo CD if missing, or upgrades it if already present, avoiding the name conflict and allowing the pipeline to run cleanly on every execution.
      # Upgrade if exists, install if missing — avoids "name still in use"
      - name: Install Argo CD
        if: github.event.inputs.destroy != 'true'
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --set applicationSet.enabled=false \
            --timeout 10m


      # Wait until the Argo CD server is ready.
      - name: Wait for Argo CD
        if: github.event.inputs.destroy != 'true'
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/argocd-server \
            -n argocd \
            --timeout=300s


      # Register our Argo CD Applications with the Argo CD instance.
      # This file contains both eks-app and monitoring
      - name: Register Argo CD Applications
        if: github.event.inputs.destroy != 'true'
        run: |
          kubectl apply -f argocd/argocd_application.yml



      # Stage 15: Destroy Infra
      # It only runs the step if a workflow input variable named destroy equals "true". That input comes from workflow_dispatch, which lets you trigger workflows manually and pass parameters.
      # When you trigger this workflow manually in GitHub’s Actions tab, you’ll see a dropdown/input asking: Destroy infrastructure? 
      # Manual trigger with destroy=true → Executes Terraform Destroy.

      # I defined tf_vars to hold terraform secrets in the "env:" section at the top of this script. So on every terraform init, plan, apply or destroy, The secret values will be used.
      - name: Terraform Destroy
        working-directory: ${{ env.TERRAFORM_DIR }}
        if: github.event.inputs.destroy == 'true'
        run: |
          terraform destroy -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}






#-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# GITHUB EVENTS

# if: github.event_name == 'workflow_dispatch' →  Checks the type of trigger. It runs if the workflow was triggered manually, regardless of what inputs were passed.
# if: github.event.inputs.destroy == 'true' →  Checks the value of an input variable from the manual trigger. Runs only if you ran the workflow manually AND selected destroy = true.

# So:
# First one checks how the workflow was started.
# Second one checks what options were passed when it started.


#-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# DYNAMICALLY ADDING VARIABLE VALUES TO YAML FILES ON GITHUB ACTIONS (Especially when handled by ArgoCD)

# One challenge I encountered while working on the kubernetes manifests was how I would pass values to dynamic variables like cognito secrets, image name and tag etc to ArgoCD without disrupting its process.
# I thought-of and tried out multiple approaches (see end of this CI/CD file for more notes on this) but the Native Templating (envsubst) won.


# Rank 1 (Chosen): envsubst + Template Files

# How it works: 
  # Create configuration files with ${VAR} placeholders and name them *.template.yml. Keep these templates in a separate folder (not watched by Argo CD).
  # During CI/CD, envsubst replaces the placeholders with real values and writes the final .yml files.
  # The final files are committed to Git in the folders Argo CD watches (manifests/, monitoring/).
  # Argo CD deploys only those final rendered manifests.

# Why it won:
  # No delimiter crashes: envsubst uses the standard ${...} syntax, so values with colons, slashes, pipes, or spaces are replaced safely without any custom separator.
  # Templates stay reusable: Because you render into separate files, the original .template.yaml files are never overwritten, allowing future pipeline runs to reuse them.
  # GitOps integrity: The rendered YAML remains in Git, so Argo CD can self‑heal and audits are fully visible.
  # No pipeline loops: The [skip ci] in the commit message prevents the Git push from triggering another workflow run.

# Concerns & how they were resolved:
  # Delimiter risk: Resolved because envsubst doesn’t rely on a user‑chosen separator; it replaces exact variable names, so any value content is safe.
  # Template overwriting: Avoided by using .template.yaml files and writing to a different output file (e.g., ingress.yaml), leaving the template untouched.
  # Git commit loops: Prevented by adding [skip ci] to the commit message; the workflow is configured to ignore such commits.
  # Scaling to many variables: All variables are replaced in one envsubst command per file, eliminating the need for manual mapping.

#-------------

# Rank 2: AWS SSM/Secrets Manager + Argo CD Vault Plugin

# How it works: 
  # Terraform saves values (especially secrets) into AWS Parameter Store or Secrets Manager.
  # Argo CD has a plugin that reads those values at deploy time and automatically inserts them into your manifests.
  # You don’t commit actual secret values to Git.

# Concerns:
  # Requires installing and maintaining the Argo CD Vault plugin, including extra configuration and IAM permissions.
  # Adds operational complexity and is overkill for non‑secret values like ACM ARNs or Cognito IDs.
  # Not needed if the values aren’t sensitive; using it for simple configuration adds unnecessary moving parts.

#-------------

# Rank 3: Argo CD CLI / kubectl Patch Overrides

# How it works: 
  # After Terraform finishes, your CI runs a command like argocd app set -p key=value or kubectl patch to change the live cluster directly.

# Concerns:
  # Bypasses Git, causing drift between the desired state in the repository and the live cluster.
  # Requires the CI runner to have direct network access and credentials to the Kubernetes cluster, increasing security risk.
  # No audit trail in Git; difficult to reproduce or review changes. Changes are not saved in Git, so they can be lost or conflict with Argo CD’s self‑healing. 
  # Conflicts with Argo CD selfHeal: true (the next sync may revert the override).

#-------------

# Rank 4: sed Stream‑Editor Scripts

# How it works: 
  # You use sed commands to find and replace {{VAR}} placeholders in your YAML files, then commit the changed files.

# Concerns:
  # Delimiter crash: if a Terraform output contains the chosen separator (e.g., |), the sed command breaks.
  # Manual mapping: each variable requires its own sed line; with many variables, errors are likely.
  # Overwrites source files unless you create separate templates, otherwise the placeholder is lost after the first run.
  # Maintenance burden grows quickly, making it fragile for larger projects.

#-------------

# Rank 5: Inline Python + PyYAML

# How it works: 
# A Python script reads your YAML file as a dictionary, changes the needed keys, and writes the file back.

# Concerns:
  # Over‑engineered for simple string substitution; adds a whole scripting layer for little benefit.
  # PyYAML re‑writing strips comments, ordering, and formatting, making the output less readable.
  # More code to maintain and debug; envsubst does the same job in one line without these issues.