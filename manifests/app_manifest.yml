# This yaml file will define the deploymnent and service manifests of the eks-app

apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels:

      # Deployment manages Pods with the label app=eks-app
      app: eks-app              
  template:
    metadata:
      labels:

        # Every Pod created by this Deployment gets app=eks-app
        app: eks-app            
    spec:
      nodeSelector:

        # Pod MUST run on a node with role=app_worker
        role: app_worker     
        
      # I created a service account and attached it using terraform pod identity. I will just reference the service account name here.
      serviceAccountName: eks-app-service-account   
        
      containers:
      - name: my-webapp
        image: "337909745504.dkr.ecr.eu-north-1.amazonaws.com/eks_app:9c66cff6120ec336a97781f424d3aaff2cc411fc"
        ports:
        - containerPort: 80



--- 



apiVersion: v1
kind: Service
metadata:
  name: eks-app-svc

  # The ALB health check path defaults to '/' because that’s the standard behavior of the AWS Load Balancer Controller when creating a target group from a Kubernetes Service. 
  # It doesn’t automatically know which path is appropriate for the application. It just uses the root by convention. So I need to configure the correct health check path for my app either; 
  # Automatically using this yml manifest as shown below OR Manually using the CLI: kubectl annotate svc <service_name> -n default alb.ingress.kubernetes.io/healthcheck-path=/health 
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  selector:

    # Send traffic to Pods with label: app=eks-app
    app: eks-app                
  ports:
    - protocol: TCP

      # Port exposed by the Service
      port: 80        

      # Port on the application Pod          
      targetPort: 80       

  # Internal Kubernetes access only. Loadbalacer exposes the service to the outside world     
  type: ClusterIP               
